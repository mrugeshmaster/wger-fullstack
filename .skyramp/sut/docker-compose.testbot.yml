services:
  web:
    build:
      context: ./wger
      dockerfile: extras/docker/production/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "True"
      DJANGO_PERFORM_MIGRATIONS: "True"
      WGER_USE_GUNICORN: "False"
      SYNC_EXERCISES_ON_STARTUP: "False"
      DOWNLOAD_EXERCISE_IMAGES_ON_STARTUP: "False"
      DOWNLOAD_EXERCISE_VIDEOS_ON_STARTUP: "False"
      LOAD_ONLINE_FIXTURES_ON_STARTUP: "False"
      SECRET_KEY: "testbot-secret-key-do-not-use-in-production-wger-1234567890"
      JWT_PRIVATE_KEY: ""
      JWT_PUBLIC_KEY: ""
      SITE_URL: "http://localhost:8000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/api/v2/version/"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 180s

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./wger-react:/app
    ports:
      - "3000:3000"
    environment:
      BROWSER: "none"
    depends_on:
      web:
        condition: service_healthy
    command: >
      sh -c "printf 'VITE_API_SERVER=http://localhost:8000\n' > .env.development.local &&
             npm install &&
             npx vite --host 0.0.0.0 --port 3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
