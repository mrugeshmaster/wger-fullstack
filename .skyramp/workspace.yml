# Skyramp Workspace Configuration
workspace:
  repoName: mrugeshmaster/wger-fullstack
  repoUrl: https://github.com/mrugeshmaster/wger-fullstack
metadata:
  schemaVersion: v1
  executorVersion: v1.3.29
  createdAt: "2026-06-25T23:06:30.817Z"
  updatedAt: "2026-06-25T23:06:30.824Z"
services:
  - serviceName: wger-fullstack-backend
    language: python
    framework: pytest
    testDirectory: tests/skyramp/wger
    api:
      schemaPath: http://localhost/api/v2/schema/
      authType: bearer
      authHeader: Authorization
      baseUrl: http://localhost
    runtimeDetails:
      serverStartCommand: docker compose -f .skyramp/sut/docker-compose.yml up -d web
      runtime: docker
      dockerNetwork: sut_default
  - serviceName: wger-fullstack-wger-react-frontend
    language: typescript
    framework: playwright
    testDirectory: tests/skyramp/wger-react
    api:
      authType: none
      authHeader: ""
      baseUrl: http://localhost:3000
    runtimeDetails:
      serverStartCommand: npm run start
      runtime: local
