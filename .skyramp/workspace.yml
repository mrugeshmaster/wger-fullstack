# Skyramp Workspace Configuration
workspace:
  repoName: mrugeshmaster/wger-fullstack
  repoUrl: https://github.com/mrugeshmaster/wger-fullstack
metadata:
  schemaVersion: v1
  executorVersion: v1.3.30
  createdAt: "2026-06-29T22:41:41.336Z"
  updatedAt: "2026-06-29T22:41:41.342Z"
services:
  - serviceName: wger-fullstack-wger-backend
    language: python
    framework: pytest
    testDirectory: tests/skyramp/wger
    api:
      schemaPath: http://localhost:8000/api/v2/schema
      authType: bearer
      authHeader: Authorization
      baseUrl: http://localhost:8000/api/v2
    runtimeDetails:
      serverStartCommand: docker compose -f .skyramp/sut/docker-compose.testbot.yml --project-directory . up -d web
      runtime: docker
      dockerNetwork: wger-fullstack_default
  - serviceName: wger-fullstack-wger-react-frontend
    language: typescript
    framework: playwright
    testDirectory: tests/skyramp/wger-react
    api:
      authType: none
      authHeader: ""
      baseUrl: http://localhost:3000
    runtimeDetails:
      serverStartCommand: docker compose -f .skyramp/sut/docker-compose.testbot.yml --project-directory . up -d frontend
      runtime: docker
      dockerNetwork: wger-fullstack_default
